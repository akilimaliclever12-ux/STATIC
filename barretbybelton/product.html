<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarretbyBelton — Agiza suti / Order a suit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="showroom-page">
<header class="nav always">
  <a class="logo" href="index.html">Barret<i>by</i>Belton</a>
  <div class="right"><div class="lang"><button data-lang="sw">SW</button><button data-lang="en">EN</button></div></div>
</header>

<section class="room" id="room">
  <div class="light"></div>
  <div class="wall-word" aria-hidden="true">BELTON</div>
  <div class="floor"></div>

  <nav class="tabs" id="tabs"></nav>
  <div class="pager" id="pager"></div>

  <div class="cards left" id="cardsL"></div>
  <div class="figure" id="figure">
    <img class="a on" id="imgA" alt="">
    <img class="b" id="imgB" alt="">
  </div>
  <div class="cards right" id="cardsR"></div>
</section>

<section class="bar">
  <div class="picked">
    <p class="kicker" id="pCat"></p>
    <h1 id="pName"></h1>
    <p class="price" id="pPrice"></p>
  </div>
  <div class="sizebox">
    <p class="kicker" data-i18n="fit_h"></p>
    <div class="sizes2" id="sizes"></div>
    <p class="muted"><span data-i18n="sum_size"></span>: <b id="sSize">—</b> · <span data-i18n="sum_ready"></span>: <b id="sReady">—</b></p>
    <details class="meas" id="meas">
      <summary data-i18n="meas_h"></summary>
      <div class="seg" id="units" style="margin:12px 0 6px"></div>
      <div id="sliders"></div>
    </details>
  </div>
  <div class="orderbox">
    <a class="btn big" id="send" target="_blank" rel="noopener" data-i18n="send"></a>
    <p class="muted" data-i18n="note"></p>
    <p class="muted" data-i18n="room_note"></p>
  </div>
</section>

<script src="i18n.js"></script>
<script src="product.js"></script>
</body>
</html>
